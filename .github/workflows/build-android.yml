name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Decode keystore from base64 secret
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      # Create key.properties for Gradle signing config
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.PASSWORD }}
          keyPassword=${{ secrets.PASSWORD }}
          keyAlias=release
          storeFile=release-key.jks
          EOF

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }} \
            --dart-define=TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}

      # Upload APK as artifact (downloadable from Actions tab)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-downloader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Auto-create GitHub Release when a tag is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
