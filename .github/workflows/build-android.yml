name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      telegram_api_id:
        description: 'Telegram API ID for this build (optional, overrides repo secret)'
        required: false
        type: string
      telegram_api_hash:
        description: 'Telegram API HASH for this build (optional, overrides repo secret)'
        required: false
        type: string
      create_release:
        description: 'Also publish this manual run to GitHub Releases'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag name to use when create_release is true (example: v0.1.0-preview.1)'
        required: false
        type: string

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Derive build version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BUILD_NAME="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            BUILD_NAME="${{ github.event.inputs.release_tag }}"
            BUILD_NAME="${BUILD_NAME#v}"
          else
            BUILD_NAME="0.0.0"
          fi

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"

      # Decode keystore from base64 secret
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      # Create key.properties for Gradle signing config
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.PASSWORD }}
          keyPassword=${{ secrets.PASSWORD }}
          keyAlias=release
          storeFile=release-key.jks
          EOF

      - name: Build Release APKs (split per ABI)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --build-name="${BUILD_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=TELEGRAM_API_ID=${{ github.event.inputs.telegram_api_id || secrets.TELEGRAM_API_ID }} \
            --dart-define=TELEGRAM_API_HASH=${{ github.event.inputs.telegram_api_hash || secrets.TELEGRAM_API_HASH }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-downloader-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      # Auto-create GitHub Release when a tag is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' && github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
